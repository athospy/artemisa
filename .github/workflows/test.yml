name: Tests

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: artemisa
          POSTGRES_USER: artemisa
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artemisa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      DB_NAME: artemisa
      DB_USER: artemisa
      DB_PASSWORD: ci-only-password
      DB_HOST: localhost
      DB_PORT: "5432"
      # No ANTHROPIC_API_KEY: every test that touches the recap mocks the API.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"  # same as the production server
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: No model change without a migration
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test artemisa -v 2
