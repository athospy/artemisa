name: Deploy to Production

# Deploys only after the "Tests" workflow passes on a push to main
# (or when started by hand from the Actions tab).
on:
  workflow_run:
    workflows: [ "Tests" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Deploy exactly the commit the tests ran on.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H ${{ secrets.PROD_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Prepare server directory permissions
        run: |
          ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} << 'EOF'
          set -e
          cd ${{ secrets.PROD_PROJECT_PATH }}
          
          # Fix ownership and permissions for the project directory
          chown -R root:root .
          chmod -R u+w .

          # Gunicorn runs as www-data and must be able to read .env; the chown above
          # would otherwise lock it out and the app fails to start (2026-11 outage).
          if [ -f .env ]; then
            chown root:www-data .env
            chmod 640 .env
          fi

          # Clean static directory if it exists (will be regenerated by collectstatic)
          rm -rf static/
          EOF

      - name: Sync repo to server via rsync
        # /static/ and /media/ are anchored to the repo root: they skip only the
        # collectstatic output and uploads. Unanchored 'static/' also skipped
        # artemisa/static/, so JS/CSS changes never reached the server.
        run: |
          rsync -az \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '__pycache__/' \
            --exclude 'venv/' \
            --exclude 'aremisaenv/' \
            --exclude 'artemisaenv/' \
            --exclude '*.env' \
            --exclude '/media/' \
            --exclude '/static/' \
            --exclude 'node_modules/' \
            ./ ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:${{ secrets.PROD_PROJECT_PATH }}

      - name: Remote deploy commands
        shell: bash
        run: |
          ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} << 'EOF'
          set -e
          cd ${{ secrets.PROD_PROJECT_PATH }}

          # Ensure python3-venv present and create venv if missing
          if [ ! -d "venv" ]; then
            if ! python3 -m venv venv; then
              apt-get update && apt-get install -y python3-venv
              python3 -m venv venv
            fi
          fi

          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

          # Django maintenance
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput
          
          # Fix permissions for www-data to serve static files
          # media/ doesn't exist until the first upload; without it chown fails,
          # set -e stops the script and gunicorn is never restarted.
          mkdir -p static media
          chown -R www-data:www-data static/ media/
          chmod -R u+rw static/ media/

          # Restart services (configure secrets with correct names)
          systemctl restart ${{ secrets.PROD_GUNICORN_SERVICE || 'artemisa_gunicorn' }} || true
          systemctl reload ${{ secrets.PROD_NGINX_SERVICE || 'nginx' }} || true
          EOF
