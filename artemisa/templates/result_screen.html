{% extends "layout.html" %}
{% load static %}

{% block title %} Artemisa - {{competition.code}} results  {% endblock %}

{% block content %}

<div class="jumbotron">
    <div class="container">
        <p class="display-4 text-center">Results</p>
        <p>
            <select id='select_category' class="large-select">
                <option disabled selected>Select category</option>
                {% for category in categories %}
                    <option value="{{category.id}}">{{category.name}}</option>
                {% endfor %}
            </select>
        </p>
    </div>
</div>

<div class="container mb-5" id="result_container" data-competition-id="{{ competition.id }}">
    <div class="row font-weight-bold">
        <div class="col-1">#</div>
        <div class="col-5">Archer</div>
        <div class="col-2 text-center">Score</div>
        <div class="col-1 text-center">10s</div>
        <div class="col-1 text-center">Xs</div>
        <div class="col-2 text-center">Last End</div>
    </div>
</div>


{% endblock %}

{% block scripts %}
    <script src="{% static 'artemisa/results.js' %}"></script>
{% endblock %}
