<div class="row mb-2 input-row">
    <div class="col-12 col-lg">
        End {{end_number}}
    </div>
    <div class="col-2 col-lg score_input">
        <input class="js-kioskboard-input form-control shoot_input text-center custom-input" data-kioskboard-type="keyboard" data-kioskboard-placement="bottom" data-kioskboard-specialcharacters="false" placeholder="-" data-archer_id="{{archer_id}}" data-end="{{end_number}}" data-shoot="1" aria-label="shoot 1" />
    </div>
    <div class="col-2 col-lg score_input">
        <input class="js-kioskboard-input form-control shoot_input text-center custom-input" data-kioskboard-type="keyboard" data-kioskboard-placement="bottom" data-kioskboard-specialcharacters="false" placeholder="-" data-archer_id="{{archer_id}}" data-end="{{end_number}}" data-shoot="2" aria-label="shoot 2" />
    </div>
    <div class="col-2 col-lg score_input">
        <input class="js-kioskboard-input form-control shoot_input text-center custom-input" data-kioskboard-type="keyboard" data-kioskboard-placement="bottom" data-kioskboard-specialcharacters="false" placeholder="-" data-archer_id="{{archer_id}}" data-end="{{end_number}}" data-shoot="3" aria-label="shoot 3" />
    </div>
    <div class="col-2 col-lg score_input">
        <input class="js-kioskboard-input form-control shoot_input text-center custom-input" data-kioskboard-type="keyboard" data-kioskboard-placement="bottom" data-kioskboard-specialcharacters="false" placeholder="-" data-archer_id="{{archer_id}}" data-end="{{end_number}}" data-shoot="4" aria-label="shoot 4" />

    </div>
    <div class="col-2 col-lg score_input">
        <input class="js-kioskboard-input form-control shoot_input text-center custom-input" data-kioskboard-type="keyboard" data-kioskboard-placement="bottom" data-kioskboard-specialcharacters="false" placeholder="-" data-archer_id="{{archer_id}}" data-end="{{end_number}}" data-shoot="5" aria-label="shoot 5" />
    </div>
    <div class="col-2 col-lg score_input">
        <input class="js-kioskboard-input form-control shoot_input text-center custom-input" data-kioskboard-type="keyboard" data-kioskboard-placement="bottom" data-kioskboard-specialcharacters="false" placeholder="-" data-archer_id="{{archer_id}}" data-end="{{end_number}}" data-shoot="6" aria-label="shoot 6" />
    </div>
    <!-- Add the hr for small screens -->
    <div class="col-12 d-block d-lg-none">
        <hr>
    </div>
    <div class="col-2 col-lg score_input">
        <input type="text" class="form-control text-center custom-input"  placeholder="Partial" id="archer_{{archer_id}}_end_{{end_number}}_partial" disabled="disabled" aria-label="partial">
    </div>
    <div class="col-2 col-lg score_input">
        <input type="text" class="form-control end_total text-center custom-input"  placeholder="Total" id="archer_{{archer_id}}_end_{{end_number}}_total" disabled="disabled" aria-label="total">
    </div>
    <div class="col-2 col-lg score_input">
        <input type="text" class="form-control text-center custom-input"  placeholder="10s" id="archer_{{archer_id}}_end_{{end_number}}_10s" disabled="disabled" aria-label="10s">
    </div>
    <div class="col-2 col-lg score_input">
        <input type="text" class="form-control text-center custom-input"  placeholder="Xs" id="archer_{{archer_id}}_end_{{end_number}}_xs" disabled="disabled" aria-label="Xs">
    </div>
    <div class="col-12">
        <button type="button" class="btn btn-info btn-sm btn-block" data-archer_id="{{archer_id}}" data-end="{{end_number}}" id="archer_{{archer_id}}_end_{{end_number}}_button" style="display: none;">Next</button>
    </div>
</div>
