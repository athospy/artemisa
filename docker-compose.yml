version: "3.9"
services:
  db:
    image: postgres:17
    container_name: artemisa-db
    environment:
      POSTGRES_DB: ${DB_NAME:-artemisa}
      POSTGRES_USER: ${DB_USER:-artemisa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-artemisa}
    ports:
      - "${DB_PORT:-54322}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-artemisa} -d ${DB_NAME:-artemisa}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db_data:
